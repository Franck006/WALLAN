services:
  wallan:
    build: 
      context: .
      dockerfile: Dockerfile

    container_name: wallan-app

    ports:
     - "3000:3000"

    env_file:
      - .env.local 

    volumes:
      - .:/app
      - wallan_node_modules:/app/node_modules
      - wallan_next:/app/.next

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"

    command: npm run dev -- --hostname 0.0.0.0 --webpack

volumes:
  wallan_node_modules:
  wallan_next: 